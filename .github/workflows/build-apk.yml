name: Build Bot APK

on:
  push:
    paths:
      - 'input/*.zip'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Unzip Bot Source
      run: |
        mkdir -p extracted
        unzip -o input/*.zip -d extracted/
        echo "Source bot berhasil di-extract"

    - name: Move Bot to Android Assets
      run: |
        mkdir -p android-template/app/src/main/assets/bot-source
        cp -r extracted/* android-template/app/src/main/assets/bot-source/

    - name: Grant Execute Permission
      run: chmod +x android-template/gradlew

    - name: Build APK
      run: |
        cd android-template
        ./gradlew assembleDebug

    - name: Rename APK Dynamically
      run: |
        # Ambil nama ZIP asli buat nama APK
        ZIP_NAME=$(basename input/*.zip .zip)
        mv android-template/app/build/outputs/apk/debug/app-debug.apk android-template/app/build/outputs/apk/debug/${ZIP_NAME}.apk

    - name: Create Release and Upload APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_id }}
        name: Build ${{ github.run_id }}
        files: android-template/app/build/outputs/apk/debug/*.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
